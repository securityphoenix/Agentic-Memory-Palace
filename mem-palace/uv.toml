# Deliberately no `python-preference` setting here.
#
# Forcing "only-managed" makes `uv sync` pick a uv-managed interpreter even when
# the only managed one is built for the wrong CPU architecture. On an arm64 Mac
# that leaves you compiling `cryptography` from source, which fails without a
# Rust toolchain and OpenSSL headers. Letting uv choose freely avoids that.
#
# If uv still picks a bad interpreter, pin one:
#   uv sync --python 3.13
#   ./install.sh /path/to/project --python 3.13

# Security floors for transitive deps (CVE remediation — see OSV advisories).
# Constraints bump these only if present in the resolved tree; they add no new direct deps.
constraint-dependencies = [
    "starlette>=1.3.1",
    "pyjwt>=2.13.0",
    "cryptography>=50.0.0",
    "python-multipart>=0.0.31",
    "idna>=3.15",
    "pydantic-settings>=2.14.2",
]
